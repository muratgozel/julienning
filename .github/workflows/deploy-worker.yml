name: deploy-worker

# Manual only: the team lead deploys from the Actions tab (or `npm run deploy`
# locally). Automatic deploys on push would need the Cloudflare secrets on
# every fork and would ship any merged change straight to the team's Worker.
on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a queued run waits instead of racing wrangler.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
